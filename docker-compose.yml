# =============================================================================
# GusVoice — full stack on ONE host, one compose file.
#
#   postgres + redis + livekit (SFU) + backend + presence + client
#
# TLS / public hostnames are terminated by your EXISTING Nginx Proxy Manager,
# which sits in front of this stack (see README "Reverse proxy / NPM").
#
# Port-binding strategy (BIND_ADDR, default 127.0.0.1):
#   * Services that NPM proxies (client/backend/presence/livekit-signaling) bind to
#     ${BIND_ADDR}. Default 127.0.0.1 suits local dev or NPM on the SAME host. When
#     NPM runs on a DIFFERENT host, set BIND_ADDR=0.0.0.0 so it can reach them.
#   * LiveKit media ports 7881/tcp + 7882/udp always bind 0.0.0.0 — clients reach
#     them DIRECTLY at the host's public IP (NPM does not proxy media).
# =============================================================================

name: gusvoice

# Docker's json-file driver keeps logs FOREVER by default (no max-size/max-file), and LiveKit is very
# chatty — it writes ~56 MB/day of per-packet rtpstats telemetry, so its log hit 394 MB in under a week
# on the prod VM. Left alone this eventually fills the disk and takes the whole stack down. Cap it:
# 50 MB × 3 files = 150 MB ceiling per service. Applied to the two services that actually grow
# (livekit + backend, both ~50 MB/day); postgres/redis/presence/client write 1-4 MB/week, so they're
# left alone to keep the blast radius of a compose change small (adding `logging:` recreates the
# container). Add `logging: *capped-logs` to any service that starts getting noisy.
x-logging: &capped-logs
  driver: json-file
  options:
    max-size: '50m'
    max-file: '3'

services:
  postgres:
    # Exact version + the digest already running in production (О5, 15.09): a floating `16-alpine` re-pulled a different
    # build on every update. Bump deliberately: change BOTH the tag and the digest.
    image: postgres:16.14-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      # fail-closed: never boot Postgres with an empty/guessable password (P0, #133).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run ./install.sh or set it in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    # Exact version + digest, as for postgres. Redis 7.4+ is licensed RSALv2/SSPL (not OSI open source); the box does not
    # redistribute it — Docker pulls the official image — so it stays (decision 2026-09-16).
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  livekit:
    image: livekit/livekit-server:v1.13.1
    restart: unless-stopped
    logging: *capped-logs
    command: ['--config', '/etc/livekit.yaml']
    environment:
      # "<key-name>: <secret>" — name must match webhook.api_key in livekit.yaml.
      # fail-closed: an empty secret would mint forgeable room tokens (P0, #133).
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required — run ./install.sh or set it in .env}'
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '${BIND_ADDR:-127.0.0.1}:7880:7880' # signaling (NPM → wss)
      - '7881:7881' # TCP media fallback (public)
      - '7882:7882/udp' # UDP media mux (public)
      - '${BIND_ADDR:-127.0.0.1}:6789:6789' # Prometheus metrics (LAN-only; see livekit.yaml)
    networks: [internal]

  backend:
    image: ${REGISTRY:-gusvoice}/backend:${TAG:-local}
    logging: *capped-logs
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_PORT: '4000'
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # fail-closed: an empty JWT secret makes every session token forgeable (P0, #133).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — run ./install.sh or set it in .env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL_INTERNAL: http://livekit:7880
      LIVEKIT_URL_EXTERNAL: ${LIVEKIT_URL_EXTERNAL}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-}
      # First-boot: backend seeds a pre-verified super-admin from these (install.sh sets them).
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      # Setup code for the first-run web wizard (install.sh generates and prints it). While no super-admin
      # exists, https://voice.<domain> opens the wizard only with this code. Empty => no wizard (as before).
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Where brute-force alerts are e-mailed. Empty => the super-admin's own address. (Was missing from this
      # list, so the value in .env never reached the backend and alerts were only logged.)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-GusVoice <noreply@localhost>}
      # Anti-bot registration (#135): purge abandoned unverified accounts older than N days (0 = off),
      # and an instance-wide signups/hour ceiling on top of the per-IP limit. Both have safe defaults.
      UNVERIFIED_TTL_DAYS: ${UNVERIFIED_TTL_DAYS:-7}
      REGISTER_GLOBAL_MAX: ${REGISTER_GLOBAL_MAX:-100}
      # Diagnostics (#113). ONE variable for backend AND client so the route gate and what the client
      # believes can't drift apart. Default OFF on purpose: an instance must not start collecting data
      # about its users' machines just because it was updated. See .env.example.
      DIAG_ENABLED: ${DIAG_ENABLED:-false}
      ECONOMY_ENABLED: ${ECONOMY_ENABLED:-false}
      # Closed preview of the economy: comma-separated user IDs it is visible to while the feature is
      # under wraps. EMPTY = no restriction (normal behaviour) -- a forgotten variable must mean "as
      # before", never "hide it from everyone". Backend only: the client learns it from its own
      # profile, so the list is never published to the browser.
      ECONOMY_PREVIEW_USERS: ${ECONOMY_PREVIEW_USERS:-}
      # Voice-presence statistics (GusCoins economy, step 0). Records raw seconds spent in voice --
      # no coins are granted and nothing is shown to users. Default OFF for the same reason as
      # DIAG_ENABLED: this is data about how long your people sit in voice, and an instance must not
      # start collecting it just because it was updated. See .env.example.
      ECONOMY_STATS_ENABLED: ${ECONOMY_STATS_ENABLED:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-gusvoice}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      # Tauri updater feed (latest.json) — the public /download/{latest,windows} endpoints read it to
      # hand a fresh user the current signed Windows installer. Empty => /download returns 503. Value in .env.
      UPDATE_FEED_URL: ${UPDATE_FEED_URL:-}
      # Self-hosted F-Droid repo — the in-app Android install tab reads these (authed) for the QR + link.
      # FDROID_ADD_URL is the full URL-encoded credentialed add-link (encoded so no literal `$` for
      # compose .env interpolation to mangle). Empty => install tab shows "недоступно". Values in .env.
      FDROID_REPO_URL: ${FDROID_REPO_URL:-}
      FDROID_FINGERPRINT: ${FDROID_FINGERPRINT:-}
      FDROID_ADD_URL: ${FDROID_ADD_URL:-}
      # Self-hosted ntfy push gateway (VM 118). Backend POSTs UnifiedPush wake payloads to devices'
      # endpoints (validated to be on NTFY_BASE_URL) with NTFY_TOKEN. Empty => push disabled. Values in .env.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      # Steam game-activity source (#40 Phase 1B). STEAM_API_KEY from steamcommunity.com/dev (empty =>
      # feature OFF). STEAM_API_PUBLIC_URL = the API's own public origin (where Steam OpenID returns) —
      # defaults to the client-facing VITE_API_URL. Values in .env.
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_API_PUBLIC_URL: ${STEAM_API_PUBLIC_URL:-${VITE_API_URL:-}}
      # Импорт стикеров из Telegram (#68). Токен бота от @BotFather; пустой => импорт выключен.
      # Бот подойдёт любой: набор читается публичным getStickerSet, состоять где-либо ему не нужно.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Update button in the admin panel: where the backend learns the newest release (asked only when the super-admin
      # opens the "Instance" tab, cached for 6 h). Empty => no check. The version of THIS backend is baked into the image.
      GV_RELEASES_URL: ${GV_RELEASES_URL-https://api.github.com/repos/Gleb1290/gusvoice/releases/latest}
    # Update button: the backend never touches Docker. It drops a request into ./run/request, a systemd watcher on the
    # host runs `update.sh --from-panel` (installed by `update.sh --install-updater`), which reports progress into
    # ./run/status — READ-ONLY here, so the backend can't plant anything the host (root) would write through.
    volumes:
      - ./run/request:/app/run/request
      - ./run/status:/app/run/status:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Bundled storage only (profile "storage"): start after old MinIO media has been moved, so the
      # backend doesn't come up next to a half-filled store. `required: false` = no such wait when the
      # profile is off (external S3). Side effect, on purpose: if the move FAILS the backend still
      # starts — chat and voice keep working, old files stay unavailable until the move is re-run
      # (update.sh reports it). Needs Docker Compose 2.20+.
      storage-migrate: { condition: service_completed_successfully, required: false }
    ports:
      - '${BIND_ADDR:-127.0.0.1}:4000:4000'
    # node images carry no curl/wget for sure — node's built-in fetch is always there.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [internal]

  presence:
    image: ${REGISTRY:-gusvoice}/presence:${TAG:-local}
    build:
      context: .
      dockerfile: packages/presence/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PRESENCE_PORT: '4001'
      REDIS_URL: redis://redis:6379
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL_INTERNAL: http://livekit:7880
      BACKEND_URL_INTERNAL: http://backend:4000
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    depends_on:
      redis: { condition: service_healthy }
    ports:
      - '${BIND_ADDR:-127.0.0.1}:4001:4001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [internal]

  client:
    image: ${REGISTRY:-gusvoice}/client:${TAG:-local}
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    environment:
      # Injected into /config.js + /config.json at container start (runtime config + discovery doc).
      VITE_API_URL: ${VITE_API_URL}
      VITE_PRESENCE_WS: ${VITE_PRESENCE_WS}
      VITE_PUSH_GATEWAY: ${VITE_PUSH_GATEWAY:-}
      VITE_NTFY_SERVER: ${VITE_NTFY_SERVER:-}
      DIAG_ENABLED: ${DIAG_ENABLED:-false}
      ECONOMY_ENABLED: ${ECONOMY_ENABLED:-false}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:8080:80'
    networks: [internal]

  # ===========================================================================
  # TURNKEY BUNDLED SERVICES (opt-in via compose profiles — OFF by default, so an
  # existing external-proxy / external-S3 / external-ntfy deploy is unaffected).
  # `install.sh` enables the profiles it needs. Runtime-verified at P8 (clean VPS).
  # ===========================================================================

  # Reverse proxy with automatic HTTPS (Let's Encrypt). Profile "caddy". Reaches the
  # internal services by docker DNS (client:80, backend:4000, …) regardless of host binds.
  caddy:
    image: caddy:2.8.4-alpine
    profiles: [caddy]
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    networks: [internal]

  # Bundled S3 (media: avatars/attachments/sounds/icons). Profile "storage". versitygw keeps objects
  # as plain files (headers in extended attributes) — MinIO, used before, is archived and its images
  # are gone from Docker Hub. The S3 API stays on port 9000 and answers to the old name `minio` too,
  # so existing .env files (MINIO_ENDPOINT=minio) and proxies pointing at :9000 keep working as they
  # are. It is bound to ${BIND_ADDR} so an EXTERNAL reverse proxy can serve media.<domain>; the bundled
  # Caddy reaches it by docker DNS. The backend creates the bucket and its public-read policy itself.
  storage:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    profiles: [storage]
    restart: unless-stopped
    # The data directories must exist before versitygw starts (it exits with "chdir: no such file").
    entrypoint: ['/bin/sh', '-c', 'mkdir -p /data/s3 /data/iam && exec /usr/local/bin/docker-entrypoint.sh']
    ports:
      - '${BIND_ADDR:-127.0.0.1}:9000:9000' # S3 API for an external proxy (media.<domain>)
    environment:
      ROOT_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required — run ./install.sh or set it in .env}
      # fail-closed: no usable default — a known weak secret is the first thing scanners try (P0, #133).
      ROOT_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required — run ./install.sh or set it in .env}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_IAM_DIR: /data/iam
      VGW_PORT: ':9000'
      # OFF by default in versitygw — without it browsers can't read media cross-origin (the web client
      # and the desktop app live on other origins). Media is public-read anyway, so `*` exposes nothing.
      VGW_CORS_ALLOW_ORIGIN: '*'
      VGW_HEALTH: /health
      VGW_QUIET: 'true'
    volumes:
      - s3data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      internal:
        aliases: [minio]

  # One-shot: move media from the OLD bundled MinIO volume (boxes installed before versitygw) into
  # `storage`, verify every file, then exit. Fresh installs and already-moved boxes exit at once.
  # It lives HERE and not in update.sh because an existing box's first update is performed by its OLD
  # update.sh, which only runs `up -d --remove-orphans` on this file. The script is
  # config/storage-migrate.sh. The old volume is never deleted automatically.
  # The image is OUR OWN COPY of the last MinIO the box shipped (it also carries `mc`), pinned by the
  # very digest the upstream image has: MinIO is archived, its images are already gone from Docker Hub,
  # and this one-time move has to keep working if quay.io follows. Byte-identical copy of
  # quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z (same digest); MinIO is AGPLv3, so redistributing
  # the unmodified image is allowed — its sources are at https://github.com/minio/minio, tag
  # RELEASE.2024-12-18T13-15-44Z.
  storage-migrate:
    image: ghcr.io/gleb1290/gusvoice/minio-legacy:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    profiles: [storage]
    restart: 'no'
    entrypoint: ['/bin/bash', '/migrate/storage-migrate.sh']
    environment:
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required — run ./install.sh or set it in .env}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required — run ./install.sh or set it in .env}
    volumes:
      - miniodata:/old
      - s3data:/new
      - ./config/storage-migrate.sh:/migrate/storage-migrate.sh:ro
    depends_on:
      storage: { condition: service_healthy }
    networks: [internal]

  # Bundled push gateway (UnifiedPush over ntfy). Profile "push". anon=read-only (embedded
  # distributor subscribes); the backend publishes with NTFY_TOKEN (created by install.sh).
  # Port 80 is bound to ${BIND_ADDR}:8082 so an EXTERNAL reverse proxy can serve ntfy.<domain>.
  ntfy:
    image: binwiederhier/ntfy:v2.25.0
    profiles: [push]
    restart: unless-stopped
    command: serve
    ports:
      - '${BIND_ADDR:-127.0.0.1}:8082:80' # HTTP for an external proxy (ntfy.<domain>)
    environment:
      NTFY_BASE_URL: https://ntfy.${BASE_DOMAIN:-localhost}
      NTFY_LISTEN_HTTP: ':80'
      NTFY_BEHIND_PROXY: 'true'
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: 'read-only'
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
    volumes:
      - ntfydata:/var/lib/ntfy
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  s3data: # media (versitygw)
  miniodata: # media of boxes installed before versitygw — read once by storage-migrate, then kept until you remove it
  ntfydata:
  caddydata:
  caddyconfig:

networks:
  internal:
    driver: bridge
