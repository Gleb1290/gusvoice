server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers (P0 hardening, #133) ---------------------------------
  # CSP is tuned to what the SPA actually loads. Strict where it matters:
  #   * script-src 'self' 'wasm-unsafe-eval' blob:  — the bundle is self-hosted (no inline
  #     scripts/eval — verified); 'wasm-unsafe-eval' + blob: are REQUIRED by the RNNoise /
  #     DeepFilter noise filters (WebAssembly.instantiate + blob-URL worklets/workers).
  #   * worker-src 'self' blob:                     — gate worklet (self) + DeepFilter (blob).
  #   * style-src 'self' 'unsafe-inline'            — React inline style attrs / theme tokens.
  #   * connect/img/media stay wide (https:/wss:)   — the GENERIC picker build points at an
  #     ARBITRARY instance not known at build time, so we can't allow-list its host. This only
  #     relaxes data endpoints; script execution is still locked down, so XSS can't run.
  #   * object-src 'none'; base-uri 'none'; frame-src 'none'; frame-ancestors 'self'.
  # nginx quirk: add_header does NOT inherit into a location that sets its OWN add_header, so
  # these live on the server block (covers the SPA fallback `location /`) and are repeated in
  # `location = /index.html` (which sets Cache-Control). $gv_csp avoids duplicating the string.
  set $gv_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: wss: blob: data:; object-src 'none'; base-uri 'none'; frame-src 'none'; frame-ancestors 'self'; form-action 'self'";
  add_header Content-Security-Policy $gv_csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;

  # Runtime config — never cache (deploy-time env changes take effect).
  location = /config.js {
    add_header Cache-Control "no-store";
    try_files /config.js =404;
  }

  # Instance discovery doc (same values as /config.js, as JSON). The generic desktop/mobile client
  # fetches this cross-origin (from tauri://) after the user types their server address, so one
  # prebuilt binary can point at any instance. CORS '*' — it exposes only public URLs, no secrets.
  location = /config.json {
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
    try_files /config.json =404;
  }

  # Hashed build assets (content-addressed) — safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # DeepFilterNet3 noise-filter assets (wasm + onnx model). Public + immutable. CORS '*' so the
  # desktop app (origin tauri://localhost) can fetch them cross-origin; explicit application/wasm
  # so cross-origin streaming compilation works.
  location /noise/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    types { application/wasm wasm; }
    default_type application/octet-stream;
  }

  # Bundled sound cues (public/sounds). Immutable — the length is IN the filename, so a different
  # recording is a different URL. Never overwrite a file here in place: the old one would live on in
  # every listener's cache for a year.
  # ⚠️ `wav` НЕТ в стоковом mime.types nginx — без этой строки файл уезжает как
  # application/octet-stream. Chrome такой звук всё равно проигрывает (медиа-элементы нюхают
  # контейнер), а строгие к типу браузеры — нет. Проверено на живом проде, а не в dev-сервере:
  # у Vite тот же файл отдавался как audio/wav, и локальная проверка эту дыру НЕ показала.
  location /sounds/ {
    types { audio/wav wav; }
    default_type audio/wav;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # HTML entry point — never cache, so a new deploy loads on the next refresh
  # (no manual hard-refresh needed). Re-assert the security headers (this location's
  # own add_header would otherwise drop the server-level ones).
  location = /index.html {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy $gv_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
