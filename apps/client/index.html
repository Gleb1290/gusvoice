<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Страница щипком не масштабируется — ни в приложении, ни в браузере телефона (05.10, как у Telegram Web): щипок по
         фото, начатый в просмотре, увеличивал всё приложение, и оно оставалось увеличенным. Масштаб — только внутри
         просмотра фото (Lightbox, свой щипок). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>GusVoice</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- Runtime config: written by the container entrypoint from env vars.
         Falls back to Vite build-time env during local `vite dev`. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
