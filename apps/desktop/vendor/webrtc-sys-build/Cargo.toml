[package]
edition = "2021"
name = "webrtc-sys-build"
version = "0.3.18"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Build utilities when working with libwebrtc"
readme = false
license = "Apache-2.0"
repository = "https://github.com/livekit/rust-sdks"

[lib]
name = "webrtc_sys_build"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.fs2]
version = "0.4"

[dependencies.regex]
version = "1.0"

[dependencies.reqwest]
version = "0.12"
features = [
    "rustls-tls-native-roots",
    "blocking",
]
default-features = false

[dependencies.scratch]
version = "1.0"

[dependencies.semver]
version = "1.0"

[dependencies.zip]
version = "=9.1.3"
features = ["deflate-flate2"]
default-features = false

# Keep the pure-Rust Deflate backend used by zip 0.6; zip 9 deflate also enables Zopfli.
[dependencies.flate2]
version = "=1.1.9"
default-features = false
features = ["rust_backend"]

[[test]]
name = "zip_compat"
path = "tests/zip_compat.rs"